[versions]
# The latest versions are available at https://lambdaurora.dev/tools/import_quilt.html
minecraft = "1.19.4"
quilt_mappings = "1.19.4+build.10"
quilt_loader = "0.18.7"

quilted_fabric_api = "6.0.0-beta.3+0.76.0-1.19.4"
gravity_api = "1.0.3+quilt"
lodestone = "1.19.3-SNAPSHOT"
trinkets = "3.6.0"
cca = "5.1.0"
satin = "1.11.0"
midnightlib = "1.3.0-quilt"
mixinextras = "0.1.1"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
quilt_mappings = { module = "org.quiltmc:quilt-mappings", version.ref = "quilt_mappings" }
quilt_loader = { module = "org.quiltmc:quilt-loader", version.ref = "quilt_loader" }

quilted_fabric_api = { module = "org.quiltmc.quilted-fabric-api:quilted-fabric-api", version.ref = "quilted_fabric_api" }
quilted_fabric_api_deprecated = { module = "org.quiltmc.quilted-fabric-api:quilted-fabric-api-deprecated", version.ref = "quilted_fabric_api" }
gravity_api = { module = "maven.modrinth:gravity-api", version.ref = "gravity_api" }
lodestone = { module = "com.github.Arathain:LodestoneLib-Quilt", version.ref = "lodestone" }
trinkets = { module = "dev.emi:trinkets", version.ref = "trinkets" }
cca_base = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-base", version.ref = "cca" }
satin = { module = "io.github.ladysnake:satin", version.ref = "satin" }
midnightlib = { module = "maven.modrinth:midnightlib", version.ref = "midnightlib" }
mixinextras = { module = "com.github.LlamaLad7:MixinExtras", version.ref = "mixinextras" }

# If you have multiple similar dependencies, you can declare a dependency bundle and reference it on the build script with "libs.bundles.example".
[bundles]
quilted_fabric_api = ["quilted_fabric_api", "quilted_fabric_api_deprecated"]

[plugins]
quilt_loom = { id = "org.quiltmc.loom", version = "1.1.+" }
